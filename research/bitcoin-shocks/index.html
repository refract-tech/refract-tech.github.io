<script>
function revealHash(){if(!location.hash)return;var n=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(!n)return;var p=n;while(p){if(p.tagName==='DETAILS')p.open=true;p=p.parentElement;}requestAnimationFrame(function(){n.scrollIntoView();});}
addEventListener('hashchange',revealHash);addEventListener('DOMContentLoaded',revealHash);

(function () {
  var KEY = 'refract_studio_pw';
  function b(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  async function open(pw) {
    var d = JSON.parse(document.getElementById('cifrato').textContent);
    var k0 = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var k = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b(d.salt), iterations: d.iter, hash: 'SHA-256'}, k0,
                                          {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b(d.iv)}, k, b(d.ct));
    document.getElementById('contenuto').innerHTML = new TextDecoder().decode(pt);
    try { sessionStorage.setItem(KEY, pw); } catch (e) {}
    revealHash();
  }
  function fail() {
    try { sessionStorage.removeItem(KEY); } catch (e) {}
    var e = document.getElementById('pwerr'); if (e) e.style.display = 'block';
  }
  document.addEventListener('DOMContentLoaded', function () {
    var saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
    if (saved) open(saved).catch(fail);
    document.getElementById('pwform').addEventListener('submit', function (ev) {
      ev.preventDefault(); open(document.getElementById('pw').value).catch(fail);
    });
  });
})();

</script>
