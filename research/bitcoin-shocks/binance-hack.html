                                          {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b(d.iv)}, k, b(d.ct));
    document.getElementById('contenuto').innerHTML = new TextDecoder().decode(pt);
    try { sessionStorage.setItem(KEY, pw); } catch (e) {}
    revealHash();
  }
  function fail() {
    try { sessionStorage.removeItem(KEY); } catch (e) {}
    var e = document.getElementById('pwerr'); if (e) e.style.display = 'block';
  }
  document.addEventListener('DOMContentLoaded', function () {
    var saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
    if (saved) open(saved).catch(fail);
    document.getElementById('pwform').addEventListener('submit', function (ev) {
      ev.preventDefault(); open(document.getElementById('pw').value).catch(fail);
    });
  });
})();

</script>
